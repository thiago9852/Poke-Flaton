"Sobre o Site": "About the Site"
"O <strong>Mov Set</strong> é um portal completo criado para treinadores de Pokémon de todos os níveis. Nosso objetivo é fornecer uma plataforma amigável e intuitiva onde você pode explorar, criar e compartilhar os melhores <strong>movesets</strong>, combinações de itens, natures e habilidades recomendadas para cada Pokémon, ajudando você a montar a equipe perfeita para suas batalhas.": "<strong>Mov Set</strong> is a complete portal created for Pokémon trainers of all levels. Our goal is to provide a friendly and intuitive platform where you can explore, create and share the best <strong>movesets</strong>, combinations of items, natures and recommended abilities for each Pokémon, helping you build the perfect team for your battles."
"Sobre os Dados": "About the Data"
"Todas as informações exibidas no site incluindo nomes, tipos, status, habilidades, movimentos e imagens dos Pokémon são integradas de forma dinâmica e automatizada utilizando a <strong>PokeAPI</strong>, a API de dados pública mais robusta sobre o universo Pokémon. Dessa forma, garantimos dados confiáveis e sempre sincronizados com os jogos da franquia.": "All information displayed on the site including names, types, stats, abilities, moves and images of Pokémon is dynamically and automatically integrated using <strong>PokeAPI</strong>, the most robust public data API about the Pokémon universe. Thus, we ensure reliable data always synchronized with the franchise's games."
